spring.application.name=commitlens-api
server.port=8100
spring.config.import=optional:file:local/commitlens-api.properties[.properties]

github.base-url=${GITHUB_BASE_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

bitbucket.base-url=${BITBUCKET_BASE_URL:https://api.bitbucket.org/2.0}
bitbucket.token=${BITBUCKET_TOKEN:}
bitbucket.workspace=${BITBUCKET_WORKSPACE:}

jira.base-url=${JIRA_BASE_URL:}
jira.email=${JIRA_EMAIL:}
jira.token=${JIRA_TOKEN:}

spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder=ERROR