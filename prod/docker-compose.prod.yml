name: commitlens-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: commitlens-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-commitlens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-commitlens}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-alpine
    container_name: commitlens-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${COMMITLENS_API_IMAGE:-ghcr.io/demirhany/commit-lens/backend:latest}
    container_name: commitlens-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Redis settings
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CACHE_TYPE: redis
      # Database settings
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-commitlens}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      # CORS settings
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Integrations (Optional)
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BITBUCKET_BASE_URL: ${BITBUCKET_BASE_URL:-https://api.bitbucket.org/2.0}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-}
      BITBUCKET_WORKSPACE: ${BITBUCKET_WORKSPACE:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}

  frontend:
    image: ${COMMITLENS_FRONTEND_IMAGE:-ghcr.io/demirhany/commit-lens/frontend:latest}
    container_name: commitlens-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8100}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
      PORT: 3000
      NODE_ENV: production

volumes:
  postgres_data:
  redis_data:
